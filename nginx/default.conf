server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare sends the real visitor IP
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ~* \.(webp|png|jpg|jpeg|svg|woff2)$ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(css|js)$ { expires 7d; add_header Cache-Control "public"; }
    location /data/ { expires -1; add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri.html $uri/ =404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
