# Builds the tools image (publisher + webmaster panel) for TrueNAS:
#   ghcr.io/rafierosliputra/johorstudio-tools:latest
name: Build tools image
on:
  push:
    branches: [main]
    paths: ["tools/Dockerfile", ".github/workflows/tools-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rafierosliputra/johorstudio-tools:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
