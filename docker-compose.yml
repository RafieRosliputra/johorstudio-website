# JohorStudio.com on TrueNAS
#   web     -> the public website            http://<truenas-ip>:8080
#   silex   -> visual editor (LAN only)      http://<truenas-ip>:6805
#   tunnel  -> Cloudflare Tunnel to johorstudio.com (needs TUNNEL_TOKEN in .env)

services:
  web:
    image: nginx:1.27-alpine
    container_name: johorstudio-web
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  silex:
    image: silexlabs/silex:latest
    container_name: johorstudio-silex
    ports:
      - "6805:6805"
    environment:
      SILEX_SESSION_SECRET: ${SILEX_SESSION_SECRET}
      SILEX_URL: ${SILEX_URL:-http://localhost:6805}
      STORAGE_CONNECTORS: fs
      HOSTING_CONNECTORS: fs,download
      SILEX_FS_ROOT: /data/storage
      SILEX_FS_HOSTING_ROOT: /data/hosting
    volumes:
      - ./silex-data:/data
    restart: unless-stopped
    profiles: ["editor"]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: johorstudio-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on: [web]
    restart: unless-stopped
    profiles: ["tunnel"]
