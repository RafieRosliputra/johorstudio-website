# JohorStudio.com as a TrueNAS Custom App
# Installed by deploy/setup-truenas.sh (or by hand: Apps > Discover Apps > ⋮ > Install via YAML, name johorstudio)
#
# Folders on TrueNAS (dataset ssd/website):
#   /mnt/ssd/website/repo      this GitHub repo (git clone)
#   /mnt/ssd/website/uploads   project folders you upload (SMB share "website-uploads")
#   /mnt/ssd/website/silex     Silex editor data
#
# deploy/setup-truenas.sh fills in the 2 values marked CHANGE and installs this
# for you. To install by hand, replace them first.
#
# Cloudflare Tunnel public hostnames (Zero Trust > Networks > Tunnels):
#   johorstudio.com            -> http://web:80
#   www.johorstudio.com        -> http://web:80
#   webmaster.johorstudio.com  -> http://admin:8090     (protect with Cloudflare Access)
#   editor.johorstudio.com     -> http://silex:6805     (protect with Cloudflare Access)
#
# On the home network:  website http://192.168.0.100:8080
#                       webmaster http://192.168.0.100:8090
#                       Silex http://192.168.0.100:6805

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - /mnt/ssd/website/repo/site:/usr/share/nginx/html:ro
      - /mnt/ssd/website/repo/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/ssd/website/silex/hosting:/usr/share/nginx/html/pages:ro
    restart: unless-stopped

  admin:
    image: johorstudio-tools:local      # built on TrueNAS by deploy/setup-truenas.sh
    pull_policy: never
    command: ["tools/admin.py"]
    ports:
      - "8090:8090"
    environment:
      UPLOADS: /uploads
      ADMIN_EMAILS: "rafierosliputra@gmail.com,johorstudio@gmail.com"
      EDITOR_URL: "https://editor.johorstudio.com"
    volumes:
      - /mnt/ssd/website/repo:/work
      - /mnt/ssd/website/uploads:/uploads:ro
    restart: unless-stopped

  silex:
    image: silexlabs/silex:latest
    ports:
      - "6805:6805"
    environment:
      SILEX_SESSION_SECRET: "CHANGE-to-a-long-random-string"
      SILEX_URL: "https://editor.johorstudio.com"
      STORAGE_CONNECTORS: fs
      HOSTING_CONNECTORS: fs,download
      SILEX_FS_ROOT: /data/storage
      SILEX_FS_HOSTING_ROOT: /data/hosting
    volumes:
      - /mnt/ssd/website/silex:/data
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "CHANGE-cloudflare-tunnel-token"]
    depends_on: [web, admin, silex]
    restart: unless-stopped
